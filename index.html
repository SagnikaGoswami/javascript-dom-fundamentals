<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>

<body>
    <label for="val1">Enter val1</label>
    <input type="text" id="val1">

    <label for="val1">Enter val2</label>
    <input type="text" id="val2">

    <button id="btn" onclick="add()"></button>
    <p id="result"></p>

    <script>
        function add() {
            const num1 = Number(document.getElementById("val1"))
            const num2 = Number(document.getElementById("val2"))

            const ans = num1 + num2;

            console.log(ans);

            document.getElementById("result").innerHTML = "Answer: " + ans;
            document.getElementById("result").style.color = "red";
        }

    </script>
</body>

</html>
